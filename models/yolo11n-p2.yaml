# YOLO11n-P2: 4-Head Drone & Tiny-Object Detection Architecture
# Features dedicated P2/4 Head (Stride 4) for micro and distant drones (4x4 to 16x16 pixels)

# Parameters
nc: 1 # number of classes (drone)
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLO11n-P2 (Nano)
  s: [0.50, 0.50, 1024] # YOLO11s-P2 (Small)
  m: [0.50, 1.00, 512]  # YOLO11m-P2 (Medium)

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4 (High-resolution feature map)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

# YOLO11-P2 head with 4 detection scales
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P4/16)
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13 (P4/16)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P3/8)
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 (P2/4) - Stride 4 Upsample
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2 (Stride 4)
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4) -> Head 1: Tiny Objects (Stride 4, 160x160)

  - [-1, 1, Conv, [128, 3, 2]] # 20 (P3/8)
  - [[-1, 16], 1, Concat, [1]] # 21 cat FPN P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8) -> Head 2: Small Objects (Stride 8, 80x80)

  - [-1, 1, Conv, [256, 3, 2]] # 23 (P4/16)
  - [[-1, 13], 1, Concat, [1]] # 24 cat FPN P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16) -> Head 3: Medium Objects (Stride 16, 40x40)

  - [-1, 1, Conv, [512, 3, 2]] # 26 (P5/32)
  - [[-1, 10], 1, Concat, [1]] # 27 cat FPN P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32) -> Head 4: Large Objects (Stride 32, 20x20)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # 29 Detect(P2, P3, P4, P5)
